<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>New Context</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }

    .container {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
      font-size: 18px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      color: #666;
      font-size: 13px;
      font-weight: 500;
    }

    input, textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: #007AFF;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    textarea.content-area {
      min-height: 200px;
      font-family: 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 13px;
    }

    select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      background: white;
    }

    select:focus {
      outline: none;
      border-color: #007AFF;
    }

    .hint {
      font-size: 12px;
      color: #999;
      margin-top: 4px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-save {
      background: #007AFF;
      color: white;
    }

    .btn-save:hover {
      background: #0051D5;
    }

    .btn-cancel {
      background: #e0e0e0;
      color: #666;
    }

    .btn-cancel:hover {
      background: #d0d0d0;
    }

    .btn-ai-generate {
      width: 100%;
      margin-top: 8px;
      padding: 8px 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-ai-generate:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }

    .btn-ai-generate:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }

    .ai-status {
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      text-align: center;
    }

    .ai-status.loading {
      background: #e3f2fd;
      color: #1976d2;
    }

    .ai-status.success {
      background: #e8f5e9;
      color: #2e7d32;
    }

    .ai-status.error {
      background: #ffebee;
      color: #c62828;
    }

    .preview {
      margin-bottom: 20px;
      padding: 12px;
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      max-height: 250px;
      overflow-y: auto;
    }

    .preview-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .preview-text {
      font-size: 13px;
      color: #333;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .preview-screenshot {
      color: #666;
      font-size: 13px;
    }

    .screenshot-thumbnail {
      max-width: 100%;
      max-height: 200px;
      display: block;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2 id="title">📸 New Context</h2>

    <!-- Preview area -->
    <div id="preview" class="preview" style="display: none;">
      <div class="preview-label">Content Preview:</div>
      <div id="previewContent"></div>
    </div>

    <form id="captureForm">
      <!-- Text content area (for text captures only) -->
      <div class="form-group" id="contentGroup" style="display: none;">
        <label for="content">Content</label>
        <textarea id="content" class="content-area" placeholder="Paste your text here..."></textarea>
      </div>

      <div class="form-group">
        <label for="project">Project</label>
        <select id="project" autofocus>
          <option value="">Select or type new project...</option>
        </select>
        <input type="text" id="projectInput" placeholder="New project name" style="display: none; margin-top: 8px;">
      </div>

      <div class="form-group">
        <label for="tags">Tags</label>
        <input type="text" id="tags" placeholder="e.g., bug production payment">
        <div class="hint">Space-separated tags</div>
      </div>

      <div class="form-group">
        <label for="note">Note</label>
        <textarea id="note" placeholder="Quick note about this context..."></textarea>
        <button type="button" class="btn-ai-generate" id="aiGenerateBtn" style="display: none;">
          🤖 Auto Generate Note with AI
        </button>
        <div id="aiGenerateStatus" class="ai-status" style="display: none;"></div>
      </div>

      <div class="buttons">
        <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn-save">Save (⏎)</button>
      </div>
    </form>
  </div>

  <script src="capture-renderer.js"></script>
</body>
</html>
