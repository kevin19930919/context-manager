<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      padding: 30px;
      background: #f5f5f5;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h2 {
      margin-bottom: 24px;
      color: #333;
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #666;
      font-size: 14px;
      font-weight: 500;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }

    input:focus {
      outline: none;
      border-color: #007AFF;
    }

    .hint {
      font-size: 12px;
      color: #999;
      margin-top: 6px;
    }

    .hint a {
      color: #007AFF;
      text-decoration: none;
    }

    .hint a:hover {
      text-decoration: underline;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-save {
      background: #007AFF;
      color: white;
    }

    .btn-save:hover {
      background: #0051D5;
    }

    .btn-cancel {
      background: #e0e0e0;
      color: #666;
    }

    .btn-cancel:hover {
      background: #d0d0d0;
    }

    .success {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 20px;
      display: none;
    }

    .success.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>⚙️ AI Settings</h2>

    <div class="success" id="successMsg">Settings saved successfully!</div>

    <form id="settingsForm">
      <div class="form-group">
        <label for="claudeKey">Claude API Key</label>
        <input type="password" id="claudeKey" placeholder="sk-ant-...">
        <div class="hint">
          Get your API key from <a href="https://console.anthropic.com" target="_blank">Anthropic Console</a>
        </div>
      </div>

      <div class="form-group">
        <label for="openaiKey">OpenAI API Key</label>
        <input type="password" id="openaiKey" placeholder="sk-...">
        <div class="hint">
          Get your API key from <a href="https://platform.openai.com" target="_blank">OpenAI Platform</a>
        </div>
      </div>

      <div class="buttons">
        <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn-save">Save</button>
      </div>
    </form>
  </div>

  <script src="settings-renderer.js"></script>
</body>
</html>
