<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 300px;
      background: white;
      border-right: 1px solid #e0e0e0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h3 {
      font-size: 14px;
      font-weight: 600;
      color: #333;
    }

    .sidebar-actions {
      display: flex;
      gap: 8px;
    }

    .sidebar-actions button {
      padding: 4px 8px;
      font-size: 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      transition: background 0.2s;
    }

    .sidebar-actions button:hover {
      background: #f5f5f5;
    }

    .contexts-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .context-item {
      padding: 10px;
      margin-bottom: 4px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .context-item:hover {
      background: #f9f9f9;
      border-color: #007AFF;
    }

    .context-item.selected {
      background: #e3f2fd;
      border-color: #007AFF;
    }

    .context-checkbox {
      margin-top: 2px;
      cursor: pointer;
    }

    .context-info {
      flex: 1;
      min-width: 0;
    }

    .context-meta {
      font-size: 11px;
      color: #666;
      margin-bottom: 4px;
      display: flex;
      gap: 8px;
    }

    .context-preview {
      font-size: 12px;
      color: #333;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .context-tags {
      font-size: 10px;
      color: #007AFF;
      margin-top: 4px;
    }

    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: white;
      padding: 16px 20px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h2 {
      font-size: 18px;
      color: #333;
    }

    .provider-select {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .provider-select label {
      font-size: 13px;
      color: #666;
    }

    .provider-select select {
      padding: 4px 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 13px;
    }

    .messages-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .context-badge {
      display: inline-block;
      padding: 2px 8px;
      background: #e3f2fd;
      color: #007AFF;
      border-radius: 12px;
      font-size: 11px;
      margin: 2px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .context-badge:hover {
      background: #bbdefb;
    }

    .selected-contexts-info {
      padding: 8px 12px;
      background: #f0f8ff;
      border-top: 1px solid #e0e0e0;
      font-size: 12px;
      color: #666;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .message-actions {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .message-action-btn {
      padding: 4px 10px;
      font-size: 11px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
    }

    .message-action-btn:hover {
      background: #f5f5f5;
      border-color: #007AFF;
    }

    .message {
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
    }

    .message.user {
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .message.user .message-avatar {
      background: #007AFF;
      color: white;
    }

    .message.assistant .message-avatar {
      background: #e0e0e0;
      color: #666;
    }

    .message-content {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      font-size: 14px;
    }

    .message.user .message-content {
      background: #007AFF;
      color: white;
    }

    .message.assistant .message-content {
      background: white;
      color: #333;
      border: 1px solid #e0e0e0;
    }

    .message.assistant .message-content pre {
      background: #f5f5f5;
      padding: 8px;
      border-radius: 4px;
      overflow-x: auto;
      margin: 8px 0;
    }

    .input-container {
      background: white;
      border-top: 1px solid #e0e0e0;
      padding: 16px 20px;
      display: flex;
      gap: 12px;
    }

    .input-container textarea {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 120px;
    }

    .input-container textarea:focus {
      outline: none;
      border-color: #007AFF;
    }

    .input-container button {
      padding: 10px 20px;
      background: #007AFF;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-container button:hover:not(:disabled) {
      background: #0051D5;
    }

    .input-container button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .thinking {
      display: none;
      padding: 12px 16px;
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      color: #666;
      font-size: 14px;
      font-style: italic;
      margin-bottom: 16px;
    }

    .thinking.active {
      display: block;
    }

    .error {
      background: #ffebee;
      color: #c62828;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>🤖 AI Chat</h2>
    <div class="provider-select">
      <label for="projectSelect">Project:</label>
      <select id="projectSelect" style="min-width: 150px;">
        <option value="__all__">All Projects</option>
      </select>
      <label for="providerSelect">Provider:</label>
      <select id="providerSelect">
        <option value="claude">Claude</option>
        <option value="openai">OpenAI</option>
      </select>
      <button id="settingsBtn" style="padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px; background: white; cursor: pointer; font-size: 13px;">⚙️ Settings</button>
    </div>
  </div>

  <div class="main-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <h3>📋 Contexts (<span id="selectedCount">0</span>/<span id="totalCount">0</span>)</h3>
        <div class="sidebar-actions">
          <button id="selectAllBtn">All</button>
          <button id="clearAllBtn">None</button>
        </div>
      </div>
      <div class="contexts-list" id="contextsList">
        <!-- Contexts will be loaded here -->
      </div>
    </div>

    <div class="chat-container">
      <div class="messages-container" id="messagesContainer">
        <!-- Messages will be inserted here -->
      </div>

      <div class="selected-contexts-info" id="selectedContextsInfo">
        <span>💡 Select contexts from the left panel to include them in your conversation</span>
      </div>

      <div class="input-container">
        <textarea
          id="messageInput"
          placeholder="Ask about your contexts..."
          rows="1"
        ></textarea>
        <button id="sendBtn">Send</button>
      </div>
    </div>
  </div>

  <script src="chat-renderer.js"></script>
</body>
</html>
